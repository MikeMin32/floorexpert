services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: floorexpert
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    volumes:
      # Persists lead history across rebuilds (phone / IP uniqueness for Telegram).
      - ./data:/app/data
    environment:
      LEADS_STORE_PATH: /app/data/leads.json
      DISCOUNT_STORE_PATH: /app/data/discount-visitors.json
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
